<title>WarrantyMitra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@600;700&family=Mukta:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one calm column like a bill folder; each product is a "slip" with a perforated edge; detail view stacks coverage, store, damage check, next steps. */
:root{
  --bg:#f2f4ef; --surface:#ffffff; --sunk:#e7ebe3; --ink:#15302a; --muted:#5b6d66; --line:#cfd8d0;
  --accent:#d98a0b; --accent-ink:#5a3600; --accent-soft:#fbecd0; --teal:#1f6f63; --teal-soft:#dcefe9;
  --ok:#1f7a4d; --ok-soft:#dcf1e5; --warn:#a86200; --warn-soft:#fdebc8; --bad:#b3372b; --bad-soft:#f8dedb;
  --display:"Baloo Bhai 2","Mukta",system-ui,sans-serif; --body:"Mukta",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1916; --surface:#16231f; --sunk:#1d2d28; --ink:#e4eee9; --muted:#9db0a8; --line:#2c3f39;
  --accent:#f0a830; --accent-ink:#ffe2ad; --accent-soft:#3a2b10; --teal:#5cc2b0; --teal-soft:#183a34;
  --ok:#5fd194; --ok-soft:#173326; --warn:#f2b955; --warn-soft:#3a2c12; --bad:#f08a7e; --bad-soft:#3d1c19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1916; --surface:#16231f; --sunk:#1d2d28; --ink:#e4eee9; --muted:#9db0a8; --line:#2c3f39;
  --accent:#f0a830; --accent-ink:#ffe2ad; --accent-soft:#3a2b10; --teal:#5cc2b0; --teal-soft:#183a34;
  --ok:#5fd194; --ok-soft:#173326; --warn:#f2b955; --warn-soft:#3a2c12; --bad:#f08a7e; --bad-soft:#3d1c19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 64px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.7rem} h2{font-size:1.35rem} h3{font-size:1.08rem}
p{margin:0}
a{color:var(--teal)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.label{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand small{display:block;font-size:.85rem;color:var(--muted);font-family:var(--body)}
nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;flex-wrap:wrap}
nav.tabs button{border:0;background:transparent;color:var(--ink);font:500 .95rem var(--body);padding:6px 14px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0/.12)}
button,.btn{font:500 .95rem var(--body);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.3}
button:hover,.btn:hover{border-color:var(--teal)}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.primary:hover{filter:brightness(1.08)}
.danger{color:var(--bad)}
.ghost{background:transparent;border-color:transparent;color:var(--teal);padding-inline:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.banner{background:var(--accent-soft);color:var(--accent-ink);border-radius:var(--r);padding:10px 14px;font-size:.92rem;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:1.5rem;line-height:1.2;font-variant-numeric:tabular-nums}
@media (max-width:520px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.88rem;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;gap:12px}
.slip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:14px 16px 14px 22px;position:relative;cursor:pointer;text-align:left;width:100%;color:var(--ink);font:inherit}
.slip::before{content:"";position:absolute;left:8px;top:10px;bottom:10px;border-left:2px dotted var(--line)}
.slip:hover{border-color:var(--teal)}
.slip .meta{min-width:0}
.slip .meta p{overflow-wrap:anywhere}
.slip .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.none{background:var(--sunk);color:var(--muted)}
.pill.tag{background:var(--sunk);color:var(--muted)} .pill.sample{background:var(--accent-soft);color:var(--accent-ink)}
.bar{grid-column:1/-1;height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;display:grid;gap:12px;justify-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.stack{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
form .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
@media (max-width:560px){form .fields{grid-template-columns:1fr}}
.f{display:grid;gap:3px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:.86rem;color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;font-size:.98rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 14px;margin:0;display:grid;gap:10px;min-width:0}
legend{font-family:var(--display);font-weight:700;font-size:1.02rem;padding:0 6px}
.checks{display:flex;gap:6px 16px;flex-wrap:wrap}
.checks label{display:flex;gap:6px;align-items:center;font-size:.95rem;color:var(--ink)}
.checks input{width:auto}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.92rem;display:flex;align-items:center;gap:6px}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label:has(input:checked){background:var(--teal-soft);border-color:var(--teal);color:var(--ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.kv{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:4px 14px;font-size:.95rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.timeline{position:relative;display:grid;gap:8px;padding-top:4px}
.track{position:relative;height:26px;background:var(--sunk);border-radius:6px}
.track .seg1{position:absolute;top:0;bottom:0;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-size:.78rem;font-weight:500;white-space:nowrap;overflow:hidden}
.seg1.maker{background:var(--teal-soft);color:var(--teal)} .seg1.plan{background:var(--accent-soft);color:var(--accent-ink)}
.today{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.verdict{border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.verdict.ok{background:var(--ok-soft)} .verdict.warn{background:var(--warn-soft)} .verdict.bad{background:var(--bad-soft)}
.verdict h3{font-size:1.05rem}
.verdict.ok h3{color:var(--ok)} .verdict.warn h3{color:var(--warn)} .verdict.bad h3{color:var(--bad)}
blockquote{margin:0;border-left:3px solid var(--accent);padding:4px 10px;font-size:.93rem;background:var(--surface);border-radius:0 6px 6px 0}
ol.steps,ul.plain{margin:0;padding-left:1.2em;display:grid;gap:6px}
.bill{max-height:260px;border-radius:8px;border:1px solid var(--line);object-fit:contain;background:var(--sunk)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.cmp{border-collapse:collapse;width:100%;min-width:860px;font-size:.9rem}
table.cmp th,table.cmp td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
table.cmp thead th{font-family:var(--display);font-size:.95rem;background:var(--sunk);position:sticky;top:0}
table.cmp th[scope="row"]{font-weight:500;width:220px}
table.cmp td.us,table.cmp th.us{background:var(--teal-soft)}
.mk{font-weight:700;font-family:var(--mono)}
.mk.y{color:var(--ok)} .mk.p{color:var(--warn)} .mk.n{color:var(--bad)} .mk.q{color:var(--muted)}
.note{display:block;color:var(--muted);font-size:.8rem;line-height:1.35}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.92rem;z-index:20;max-width:calc(100% - 32px)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.sel{user-select:all}
.backrow{margin-bottom:10px}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="3" width="30" height="34" rx="4" fill="var(--teal)"/><path d="M5 31 l5 4 5-4 5 4 5-4 5 4 5-4V37H5z" fill="var(--bg)"/><path d="M13 17 l5 5 9-10" stroke="var(--accent)" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><h1>WarrantyMitra</h1><small>Is it still covered? Check before you pay for repair.</small></div>
    </div>
    <nav class="tabs" aria-label="Sections">
      <button type="button" data-view="list" aria-current="page">My items</button>
      <button type="button" data-view="form">Add item</button>
      <button type="button" data-view="compare">How it compares</button>
    </nav>
  </header>
  <div id="modeBanner" class="banner" hidden></div>
  <main id="app"></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(() => {
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY = 864e5;
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const parseD = s => { if (!s) return null; const [y,m,d] = String(s).split('-').map(Number); if (!y||!m||!d) return null; return new Date(y, m-1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate()+n); return r; };
const addMonths = (d, n) => { const r = new Date(d); const day = r.getDate(); r.setDate(1); r.setMonth(r.getMonth()+n); const last = new Date(r.getFullYear(), r.getMonth()+1, 0).getDate(); r.setDate(Math.min(day,last)); return r; };
const fmtD = d => d ? d.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'}) : '—';
const inr = n => (n || n === 0) && !isNaN(n) ? new Intl.NumberFormat('en-IN', {style:'currency', currency:'INR', maximumFractionDigits:0}).format(n) : '—';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const enc = encodeURIComponent;

const CATEGORIES = ['Mobile phone','Laptop / tablet','TV','Refrigerator','Washing machine','Air conditioner','Water purifier','Kitchen appliance','Fan / cooler','Furniture','Mattress','Two-wheeler','Car','Inverter / battery','Watch / wearable','Camera','Other'];
const PLATFORMS = ['Amazon','Flipkart','Croma','Reliance Digital','Vijay Sales','JioMart','Tata CLiQ','Myntra','Brand website','Other online'];
const PAYMENTS = ['UPI','Credit card','Debit card','EMI','Cash','Net banking'];
const OWNERS = ['Me','Amma','Nanna','Spouse','Kids','Home'];
const ORDER_LINKS = {Amazon:'https://www.amazon.in/gp/css/order-history', Flipkart:'https://www.flipkart.com/account/orders', Croma:'https://www.croma.com/my-account', 'Reliance Digital':'https://www.reliancedigital.in/', 'Vijay Sales':'https://www.vijaysales.com/', JioMart:'https://www.jiomart.com/', 'Tata CLiQ':'https://www.tatacliq.com/', Myntra:'https://www.myntra.com/my/orders'};
const PROBLEMS = [
  ['defect','Stopped working on its own'],
  ['drop','Dropped, cracked or broken'],
  ['liquid','Water or liquid damage'],
  ['surge','Power cut or voltage fluctuation'],
  ['wear','Battery, remote or consumable part'],
  ['theft','Lost or stolen'],
];

const state = { items: [], mode: 'loading', view: 'list', currentId: null, filter: 'all', editingId: null, check: null, confirmDelete: null, caps: {} };
let dbCol = null;

/* ---------- coverage maths ---------- */
function coverage(it) {
  const p = parseD(it.purchaseDate); if (!p) return null;
  const makerEnd = addDays(addMonths(p, +it.warrantyMonths || 0), -1);
  let planStart = null, planEnd = null;
  if (it.ext && +it.ext.months > 0) {
    planStart = it.ext.start === 'purchase' ? p : addDays(makerEnd, 1);
    planEnd = addDays(addMonths(planStart, +it.ext.months), -1);
  }
  const end = planEnd && planEnd > makerEnd ? planEnd : makerEnd;
  const t = today();
  const daysLeft = Math.round((end - t) / DAY);
  const span = Math.max(1, (end - p) / DAY);
  const used = Math.min(1, Math.max(0, (t - p) / DAY / span));
  return { p, makerEnd, planStart, planEnd, end, daysLeft, used, span,
    inMaker: t >= p && t <= makerEnd, inPlan: !!planEnd && t >= planStart && t <= planEnd };
}
function status(c) {
  if (!c) return { k: 'none', label: 'No date' };
  if (c.daysLeft < 0) return { k: 'bad', label: 'Expired' };
  if (c.daysLeft <= 30) return { k: 'warn', label: c.daysLeft === 0 ? 'Ends today' : `Ends in ${c.daysLeft} day${c.daysLeft === 1 ? '' : 's'}` };
  return { k: 'ok', label: 'Covered' };
}
function amcDue(it) { const d = parseD(it.amcDate); if (!d) return null; return { d, days: Math.round((d - today()) / DAY) }; }

/* ---------- storage ---------- */
const LS = 'warrantymitra-items-v1';
const local = {
  load() { try { return JSON.parse(localStorage.getItem(LS) || '[]'); } catch { return []; } },
  write(a) { try { localStorage.setItem(LS, JSON.stringify(a)); } catch {} }
};
const clean = o => JSON.parse(JSON.stringify(o));
function upsertLocal(it) { const i = state.items.findIndex(x => x.id === it.id); if (i >= 0) state.items[i] = it; else state.items.push(it); }
async function saveItem(it) {
  it.updatedAt = Date.now();
  upsertLocal(it);
  if (dbCol) { try { await dbCol.doc(it.id).set(clean(it)); } catch (e) { toast('Could not save to your account. Try again.'); } }
  else local.write(state.items);
}
async function removeItem(id) {
  state.items = state.items.filter(x => x.id !== id);
  if (dbCol) { try { await dbCol.doc(id).delete(); } catch { toast('Could not delete. Try again.'); } }
  else local.write(state.items);
}
function setBanner(text) { const b = $('#modeBanner'); b.hidden = !text; b.textContent = text || ''; }

async function boot() {
  state.items = local.load();
  render();
  if (!window.claude || !window.claude.use) { state.mode = 'local'; setBanner('Saved only in this browser. Open this page in Claude to keep your items in your account.'); render(); return; }
  const [db, user, sample, assets, downloads] = await Promise.all(['db','user','sample','assets','downloads'].map(n => window.claude.use(n).catch(() => null)));
  state.caps = { sample, assets, downloads };
  if (sample && sample.limits) { try { const l = await sample.limits(); state.caps.images = !!(l && l.images); } catch { state.caps.images = false; } }
  let id = null;
  if (db && user) { try { id = await user.id(); } catch {} }
  if (!db || !id) { state.mode = 'local'; setBanner('Saved only in this browser. Sign in to Claude to keep your items in your account.'); render(); return; }
  dbCol = db.collection('data/users/' + id);
  const pendingLocal = state.items.slice();
  let first = true;
  dbCol.onSnapshot(snap => {
    state.items = snap.docs.map(d => ({ ...d.data(), id: d.id }));
    state.mode = 'db'; setBanner('');
    if (first) { first = false; if (snap.empty && pendingLocal.length) { pendingLocal.forEach(it => dbCol.doc(it.id).set(clean(it)).catch(() => {})); } }
    render();
  }, () => { dbCol = null; state.mode = 'local'; state.items = local.load(); setBanner('Your account storage is unavailable right now, so items are saved in this browser only.'); render(); });
}

/* ---------- UI helpers ---------- */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
function go(view, id) {
  state.view = view; if (id !== undefined) state.currentId = id;
  if (view !== 'item') state.check = null;
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.view === (view === 'item' ? 'list' : view) ? 'page' : 'false'));
  render(); window.scrollTo({ top: 0 });
}
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => { if (b.dataset.view === 'form') state.editingId = null; go(b.dataset.view); }));

function render() {
  const app = $('#app');
  if (state.view === 'list') app.innerHTML = listView();
  else if (state.view === 'form') { app.innerHTML = formView(); wireForm(); }
  else if (state.view === 'item') { app.innerHTML = itemView(); wireItem(); }
  else if (state.view === 'compare') app.innerHTML = compareView();
  wireCommon();
}

/* ---------- list ---------- */
function listView() {
  const items = state.items.slice().map(it => ({ it, c: coverage(it) }));
  items.sort((a, b) => {
    const da = a.c ? (a.c.daysLeft < 0 ? 1e6 - a.c.daysLeft : a.c.daysLeft) : 2e6;
    const db_ = b.c ? (b.c.daysLeft < 0 ? 1e6 - b.c.daysLeft : b.c.daysLeft) : 2e6;
    return da - db_;
  });
  const active = items.filter(x => x.c && x.c.daysLeft >= 0);
  const soon = active.filter(x => x.c.daysLeft <= 30);
  const value = active.reduce((s, x) => s + (+x.it.price || 0), 0);
  const claims = items.filter(x => x.it.claim && x.it.claim.status && !['', 'Closed'].includes(x.it.claim.status)).length;
  const f = state.filter;
  const shown = items.filter(({ it, c }) =>
    f === 'all' ? true : f === 'soon' ? c && c.daysLeft >= 0 && c.daysLeft <= 30 : f === 'expired' ? c && c.daysLeft < 0 :
    f === 'amc' ? !!it.amcDate : f === 'claims' ? it.claim && it.claim.status && it.claim.status !== 'Closed' : (it.owner || 'Me') === f);
  const owners = [...new Set(state.items.map(it => it.owner || 'Me'))];
  const chip = (k, l) => `<button type="button" class="chip" data-filter="${esc(k)}" aria-pressed="${f === k}">${esc(l)}</button>`;

  if (state.mode === 'loading' && !state.items.length) return `<div class="empty"><span class="spin" aria-hidden="true"></span><p class="muted">Opening your warranty folder…</p></div>`;
  if (!state.items.length) return `
    <div class="empty">
      <h2>Your warranty folder is empty</h2>
      <p class="muted">Add a product with its bill, purchase date, the store you bought it from, and how long the warranty runs. WarrantyMitra counts down to the end date, reminds you before it lapses, and tells you whether a repair should be free.</p>
      <div class="row"><button type="button" class="primary" data-act="add">Add your first item</button><button type="button" data-act="samples">Try with 4 sample items</button></div>
      <p class="small muted">Sample items are labelled "Sample" and you can delete them any time.</p>
    </div>`;

  return `
    <section class="stats" aria-label="Summary">
      <div class="stat"><span class="label">Value under warranty</span><b>${inr(value)}</b><span class="small muted">${active.length} of ${items.length} items covered</span></div>

function extractPrompt(source) {
  return `You read Indian purchase bills, GST invoices and order emails/SMS (Amazon.in, Flipkart, Croma, Reliance Digital, Vijay Sales, local shops). Extract the purchase details.
Return ONLY a JSON object with these keys (null when unknown):
product (short product name), brand, model, category (one of: ${CATEGORIES.join(', ')}), purchaseDate (YYYY-MM-DD; Indian dates are usually DD/MM/YYYY; prefer invoice or delivery date), price (number in rupees, final amount paid for this product), invoiceNo (GST invoice number or order ID), channel ("online" or "store"), platform (one of: ${PLATFORMS.join(', ')}, or null), storeName (shop or seller name), storeAddress, city, pin (6-digit PIN code of the shop), storePhone, warrantyMonths (number if the bill states it), serial (serial number or IMEI if printed), payment (one of: ${PAYMENTS.join(', ')}, or null).
${source}`;
}
function regexExtract(t) {

  let m = t.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})\b/);
  if (m) o.purchaseDate = `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  else if ((m = t.match(new RegExp(`\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+(${M})[a-z]*,?\\s+(\\d{4})`, 'i')))) o.purchaseDate = `${m[3]}-${String(M.split('|').indexOf(m[2].slice(0, 3).toLowerCase()) + 1).padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  else if ((m = t.match(new RegExp(`\\b(${M})[a-z]*\\s+(\\d{1,2}),?\\s+(\\d{4})`, 'i')))) o.purchaseDate = `${m[3]}-${String(M.split('|').indexOf(m[1].slice(0, 3).toLowerCase()) + 1).padStart(2, '0')}-${m[2].padStart(2, '0')}`;

}
function applyExtract(d) {

  set('f_product', d.product); set('f_brand', d.brand); set('f_model', d.model); set('f_serial', d.serial);
  if (d.category && CATEGORIES.includes(d.category)) set('f_category', d.category);
  if (d.purchaseDate && /^\d{4}-\d{2}-\d{2}$/.test(d.purchaseDate) && parseD(d.purchaseDate)) set('f_date', d.purchaseDate);

  else if (d.channel === 'store') { const r = document.querySelector('input[name="channel"][value="store"]'); r.checked = true; r.dispatchEvent(new Event('change')); }
  if (d.platform && PLATFORMS.includes(d.platform)) set('f_platform', d.platform);

  app.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => { state.confirmDelete = null; go('item', b.dataset.open); }));
  app.querySelectorAll('[data-view-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.viewGo)));
  app.querySelectorAll('[data-filter]').forEach(b => b.addEventListener('click', () => { state.filter = b.dataset.filter; render(); }));
  app.querySelectorAll('[data-act="add"]').forEach(b => b.addEventListener('click', () => { state.editingId = null; go('form'); }));
  app.querySelectorAll('[data-act="cancelForm"]').forEach(b => b.addEventListener('click', () => { const id = state.editingId; state.editingId = null; id ? go('item', id) : go('list'); }));
  app.querySelectorAll('[data-act="samples"]').forEach(b => b.addEventListener('click', async () => { b.disabled = true; for (const it of sampleItems()) await saveItem(it); toast('4 sample items added'); render(); }));
  app.querySelectorAll('[data-act="icsAll"]').forEach(b => b.addEventListener('click', () => saveFile('warrantymitra-reminders.ics', ics(state.items), 'text/calendar')));
  app.querySelectorAll('[data-act="backup"]').forEach(b => b.addEventListener('click', () => saveFile(`warrantymitra-backup-${iso(today())}.json`, JSON.stringify(state.items, null, 2), 'application/json')));
}

boot();
})();
</script>
